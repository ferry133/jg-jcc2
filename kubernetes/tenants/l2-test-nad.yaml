# TEST ONLY, hand-written (jg-base#187 acceptance on this throwaway; jgct does
# not render NADs yet). One macvlan attachment on enp1s0 with a single static
# LAN address. 10.9.9.19: outside the UniFi DHCP pool (ferry133, 2026-10-26);
# no ARP reply in fleet-ops-65's 1–254 sweep. No gateway/routes: the pod's
# default route stays on Cilium, net1 only carries the LAN subnet.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-test
  namespace: im-apps
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan-test",
      "type": "macvlan",
      "master": "enp1s0",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [{"address": "10.9.9.19/24"}]
      }
    }
